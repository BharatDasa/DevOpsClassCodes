apiVersion: apps/v1
kind: Deployment
metadata:
  name: addressbook
  namespace: addressbook
  labels:
    app: addressbook

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: addressbook

  template:
    metadata:
      labels:
        app: addressbook

    spec:
      imagePullSecrets:
        - name: nexus-pull-secret

      containers:
        - name: addressbook
          image: 192.168.56.11:8082/repository/docker-hosted/addressbook:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]

      terminationGracePeriodSeconds: 30
