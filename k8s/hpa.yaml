apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: addressbook-hpa
  namespace: addressbook
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: addressbook
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
